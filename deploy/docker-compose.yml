# Production: PostgreSQL + the Go backend + Caddy (website, /api proxy,
# automatic HTTPS). Run from this folder - see DEPLOY.md:
#   cp .env.example .env            # then fill it in
#   docker compose up -d --build
name: arena

# Shared by every service: logs rotate at 10 MB, 5 files kept (50 MB per
# service at most), so they never fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 5s
      timeout: 3s
      retries: 20
      # While starting: checked every second, not every 5 s.
      start_period: 60s
      start_interval: 1s
    stop_grace_period: 60s # time to finish writing to disk
    networks: [internal]
    logging: *logging
    security_opt: [no-new-privileges:true]
    # Sized for a 1-2 GB server; raise them on a bigger one.
    mem_limit: 512m
    pids_limit: 200

  backend:
    build: ../golang-backend
    restart: unless-stopped
    # Shop settings and secrets (JWT_SECRET, PROMPTPAY_ID, ...): see
    # golang-backend/.env.example. The values below win over that file.
    env_file: ../golang-backend/.env
    environment:
      DATABASE_URL: postgres://arena:${POSTGRES_PASSWORD}@db:5432/arena?sslmode=disable
      GIN_MODE: release
      PORT: "8080"
      SEED_DEMO_USERS: "false"
      # Requests arrive through Caddy (the web service's fixed address
      # below); only its X-Forwarded-For is believed, so the per-IP login
      # limit sees real clients and nobody else can fake their address.
      TRUSTED_PROXIES: 172.28.0.10
      # Empty = no CORS headers: only pages from this same site can call
      # the API from a browser. The website and /api share one address, so
      # nothing else is needed.
      CORS_ALLOWED_ORIGINS: ""
      # Lets Go free memory before it reaches mem_limit below.
      GOMEMLIMIT: 200MiB
    volumes:
      - uploads:/app/uploads
    # The program writes only the slip images (the uploads volume) and
    # temporary upload files (/tmp); everything else is read-only.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # Starts together with the database (not after its health check): the
    # backend waits for the database by itself, retrying for up to
    # DB_CONNECT_TIMEOUT_SECONDS (60). Stopping still goes backend first.
    depends_on:
      db:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
      # While starting: checked every second, so web (which waits for this)
      # starts about a second after the backend is ready, not 10 s.
      start_interval: 1s
    # Longer than SHUTDOWN_TIMEOUT_SECONDS (30): requests in progress finish
    # before the database is closed (Docker's default is only 10 s).
    stop_grace_period: 35s
    networks: [internal]
    logging: *logging
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 200

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      # Your domain (e.g. arena.example.com) for automatic HTTPS, or :80 for
      # plain HTTP by IP address while testing.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data # HTTPS certificates - keep this volume
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      internal:
        # Fixed address: the backend trusts only this one (TRUSTED_PROXIES).
        ipv4_address: 172.28.0.10
    logging: *logging
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 100

# Only Caddy (web) publishes ports. Never add `ports:` to db or backend:
# ports published by Docker go around the ufw firewall.
networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          # Other containers get addresses from .128 up, so the fixed
          # address of web (.10) is never taken.
          ip_range: 172.28.0.128/25

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
