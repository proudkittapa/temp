# Production: PostgreSQL + the Go backend + Caddy (website, /api proxy,
# automatic HTTPS). Run from this folder - see DEPLOY.md:
#   cp .env.example .env            # then fill it in
#   docker compose up -d --build
name: arena

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 60s # time to finish writing to disk
    networks: [internal]

  backend:
    build: ../golang-backend
    restart: unless-stopped
    # Shop settings and secrets (JWT_SECRET, PROMPTPAY_ID, ...): see
    # golang-backend/.env.example. The values below win over that file.
    env_file: ../golang-backend/.env
    environment:
      DATABASE_URL: postgres://arena:${POSTGRES_PASSWORD}@db:5432/arena?sslmode=disable
      GIN_MODE: release
      PORT: "8080"
      SEED_DEMO_USERS: "false"
      # Requests arrive through Caddy on this network; trust its
      # X-Forwarded-For so the per-IP login limit sees real clients.
      TRUSTED_PROXIES: 172.28.0.0/24
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
    # Longer than SHUTDOWN_TIMEOUT_SECONDS (30): requests in progress finish
    # before the database is closed (Docker's default is only 10 s).
    stop_grace_period: 35s
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      # Your domain (e.g. arena.example.com) for automatic HTTPS, or :80 for
      # plain HTTP by IP address while testing.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data # HTTPS certificates - keep this volume
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
